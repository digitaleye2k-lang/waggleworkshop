name: Build APK

on:
  push:
    branches: [ busfinder ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk BusFinder.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BusFinder-apk
          path: BusFinder.apk

      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: busfinder-latest
          name: BusFinder (latest build)
          prerelease: false
          make_latest: true
          files: BusFinder.apk
